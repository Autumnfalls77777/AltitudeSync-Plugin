# ─────────────────────────────────────────────
#  AltitudeSync Configuration
# ─────────────────────────────────────────────

backend:
  # Base URL of your backend (no trailing slash)
  url: "https://altitude-vmzb.onrender.com"
  # API key sent in x-api-key header for all requests
  api-key: "your_api_key_here"
  # Vote endpoint (used by VoteListener)
  vote-endpoint: "/api/vote"

# How often (in seconds) to POST server stats (TPS, online players)
server-sync-interval: 20

settings:
  debug: true
